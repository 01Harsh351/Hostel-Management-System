<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Management — UniStay Admin ERP</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="admin-rooms">
    <div class="erp-shell">
      <aside id="erp-sidebar" class="erp-sidebar admin-sidebar"></aside>
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <div class="erp-main">
        <header id="erp-topbar" class="erp-topbar"></header>

        <main class="erp-content">
          <div class="page-header">
            <div>
              <h1 class="page-title">Room Management</h1>
              <p class="page-subtitle">Configure hostel rooms, capacity limits, occupancy counts, and status indicators.</p>
            </div>
            <div class="page-actions">
              <button type="button" id="add-room-btn" class="btn btn-primary btn-sm">Add Room</button>
            </div>
          </div>

          <section class="filter-toolbar" aria-label="Room inventory filters">
            <div class="filter-controls">
              <div class="filter-field">
                <label for="admin-room-hostel-filter">Hostel</label>
                <select id="admin-room-hostel-filter" class="form-control">
                  <option value="">All Hostels</option>
                </select>
              </div>
              <div class="filter-field">
                <label for="admin-room-type-filter">Room Type</label>
                <select id="admin-room-type-filter" class="form-control">
                  <option value="">All Room Types</option>
                  <option value="Single">Single</option>
                  <option value="Double">Double</option>
                  <option value="Triple">Triple</option>
                </select>
              </div>
              <div class="filter-field">
                <label for="admin-room-status-filter">Availability</label>
                <select id="admin-room-status-filter" class="form-control">
                  <option value="">All Statuses</option>
                  <option value="Available">Available</option>
                  <option value="Full">Full</option>
                </select>
              </div>
              <div class="filter-field" style="flex:1;">
                <label for="admin-room-search">Search Room Number</label>
                <input id="admin-room-search" type="search" class="form-control" placeholder="Search by room number or floor..." />
              </div>
            </div>
            <button type="button" id="admin-room-reset-btn" class="btn btn-secondary btn-sm">Reset</button>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2 class="panel-title">Room Inventory &amp; Occupancy</h2>
            </div>
            <div id="admin-rooms-table-wrap"></div>
          </section>
        </main>
      </div>
    </div>

    <!-- Add / Edit Room Modal -->
    <div id="room-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="room-modal-title">
      <div class="modal-dialog">
        <div class="modal-header">
          <h2 id="room-modal-title" class="modal-title">Add New Room</h2>
          <button type="button" class="modal-close-btn" data-close-room-modal aria-label="Close room dialog">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
        <form id="room-form" novalidate>
          <div class="modal-body">
            <div class="form-group">
              <label for="room-hostel" class="form-label">Hostel <span class="required-mark">*</span></label>
              <select id="room-hostel" name="hostelId" class="form-control" required></select>
              <div class="field-error" data-error-for="hostelId"></div>
            </div>

            <div class="form-grid">
              <div class="form-group">
                <label for="room-number" class="form-label">Room Number <span class="required-mark">*</span></label>
                <input id="room-number" name="roomNumber" type="text" class="form-control font-mono" placeholder="e.g. N-305" required />
                <div class="field-error" data-error-for="roomNumber"></div>
              </div>

              <div class="form-group">
                <label for="room-type" class="form-label">Room Type <span class="required-mark">*</span></label>
                <select id="room-type" name="roomType" class="form-control" required>
                  <option value="Single">Single</option>
                  <option value="Double">Double</option>
                  <option value="Triple">Triple</option>
                </select>
                <div class="field-error" data-error-for="roomType"></div>
              </div>

              <div class="form-group">
                <label for="room-capacity" class="form-label">Capacity <span class="required-mark">*</span></label>
                <input id="room-capacity" name="capacity" type="number" min="1" max="6" class="form-control font-mono" required />
                <div class="field-error" data-error-for="capacity"></div>
              </div>

              <div class="form-group">
                <label for="room-occupied" class="form-label">Occupied Count <span class="required-mark">*</span></label>
                <input id="room-occupied" name="occupiedCount" type="number" min="0" max="6" class="form-control font-mono" required />
                <div class="field-error" data-error-for="occupiedCount"></div>
              </div>
            </div>

            <div class="form-group">
              <label for="room-floor" class="form-label">Floor</label>
              <input id="room-floor" name="floor" type="text" class="form-control" placeholder="e.g. 2nd Floor" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-close-room-modal>Cancel</button>
            <button type="submit" id="room-save-btn" class="btn btn-primary">Save Room</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
