<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Allocation Management — UniStay Admin ERP</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="admin-requests">
    <div class="erp-shell">
      <aside id="erp-sidebar" class="erp-sidebar admin-sidebar"></aside>
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <div class="erp-main">
        <header id="erp-topbar" class="erp-topbar"></header>

        <main class="erp-content">
          <div class="page-header">
            <div>
              <h1 class="page-title">Room Allocation Management</h1>
              <p class="page-subtitle">Review, approve, or reject student room allocation requests with confirmation checks.</p>
            </div>
          </div>

          <section class="filter-toolbar" aria-label="Request filters">
            <div class="segmented-tabs" role="tablist" aria-label="Filter requests by status">
              <button type="button" class="segmented-tab active" data-req-status="All">All</button>
              <button type="button" class="segmented-tab" data-req-status="Pending">Pending</button>
              <button type="button" class="segmented-tab" data-req-status="Approved">Approved</button>
              <button type="button" class="segmented-tab" data-req-status="Rejected">Rejected</button>
            </div>

            <div class="filter-field" style="min-width:240px;">
              <label for="admin-requests-search" class="sr-only">Search requests</label>
              <input id="admin-requests-search" type="search" class="form-control" placeholder="Search by student, ID, or room..." />
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2 class="panel-title">Student Room Requests</h2>
            </div>
            <div id="admin-requests-table-wrap"></div>
          </section>
        </main>
      </div>
    </div>

    <!-- Request Inspection Modal -->
    <div id="request-view-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="req-view-title">
      <div class="modal-dialog">
        <div class="modal-header">
          <h2 id="req-view-title" class="modal-title">Room Request Details</h2>
          <button type="button" class="modal-close-btn" data-close-request-view aria-label="Close request details">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
        <div id="request-view-body" class="modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-close-request-view>Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
