<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hostel Management — UniStay Admin ERP</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="admin-hostels">
    <div class="erp-shell">
      <aside id="erp-sidebar" class="erp-sidebar admin-sidebar"></aside>
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <div class="erp-main">
        <header id="erp-topbar" class="erp-topbar"></header>

        <main class="erp-content">
          <div class="page-header">
            <div>
              <h1 class="page-title">Hostel Management</h1>
              <p class="page-subtitle">Add, inspect, and edit campus residence halls and total room counts.</p>
            </div>
            <div class="page-actions">
              <button type="button" id="add-hostel-btn" class="btn btn-primary btn-sm">Add Hostel</button>
            </div>
          </div>

          <section id="hostel-detail-panel" class="panel" hidden></section>

          <section class="panel">
            <div class="panel-header">
              <h2 class="panel-title">Campus Hostels Directory</h2>
            </div>
            <div id="hostels-table-wrap"></div>
          </section>
        </main>
      </div>
    </div>

    <!-- Add / Edit Hostel Modal -->
    <div id="hostel-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="hostel-modal-title">
      <div class="modal-dialog">
        <div class="modal-header">
          <h2 id="hostel-modal-title" class="modal-title">Add New Hostel</h2>
          <button type="button" class="modal-close-btn" data-close-hostel-modal aria-label="Close hostel dialog">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
        <form id="hostel-form" novalidate>
          <div class="modal-body">
            <div class="form-group">
              <label for="hostel-name" class="form-label">Hostel Name <span class="required-mark">*</span></label>
              <input id="hostel-name" name="name" type="text" class="form-control" placeholder="e.g. Ramanujan Graduate Hall" required />
              <div class="field-error" data-error-for="name"></div>
            </div>

            <div class="form-grid">
              <div class="form-group">
                <label for="hostel-type" class="form-label">Hostel Type <span class="required-mark">*</span></label>
                <select id="hostel-type" name="type" class="form-control" required>
                  <option value="Boys">Boys</option>
                  <option value="Girls">Girls</option>
                </select>
                <div class="field-error" data-error-for="type"></div>
              </div>

              <div class="form-group">
                <label for="hostel-total-rooms" class="form-label">Total Rooms <span class="required-mark">*</span></label>
                <input id="hostel-total-rooms" name="totalRooms" type="number" min="1" max="2000" class="form-control font-mono" required />
                <div class="field-error" data-error-for="totalRooms"></div>
              </div>
            </div>

            <div class="form-group">
              <label for="hostel-address" class="form-label">Campus Address <span class="required-mark">*</span></label>
              <input id="hostel-address" name="address" type="text" class="form-control" placeholder="Block & Avenue, University Estate" required />
              <div class="field-error" data-error-for="address"></div>
            </div>

            <div class="form-group">
              <label for="hostel-warden" class="form-label">Assigned Warden</label>
              <input id="hostel-warden" name="warden" type="text" class="form-control" placeholder="e.g. Dr. R. Krishnan" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-close-hostel-modal>Cancel</button>
            <button type="submit" id="hostel-save-btn" class="btn btn-primary">Save Hostel</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
